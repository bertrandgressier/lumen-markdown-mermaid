<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>tanstack-markdown-mermaid — demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c5bd4'/%3E%3Ccircle cx='10' cy='10' r='3.2' fill='white'/%3E%3Ccircle cx='22' cy='22' r='3.2' fill='white'/%3E%3Cpath d='M11 11 L21 21' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the system theme before React mounts to avoid a light flash
      // on dark systems. The app takes over from there.
      try {
        document.documentElement.dataset.theme = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
      } catch {
        /* no matchMedia — default light styles apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
